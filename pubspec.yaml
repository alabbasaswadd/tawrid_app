name: tawrid_app
description: "توريد — منصة التوريد الدوائي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0

  # Networking
  dio: ^5.11.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Font
  google_fonts: ^6.2.1

  # أيقونات نظام التصميم (SVG من Figma)
  flutter_svg: ^2.0.10

  # هياكل تحميل متلألئة (shimmer skeletons) — مكان مركزي في shared/ui
  shimmer: ^3.0.0

  # Logging
  logger: ^2.7.0

  # مسح الباركود بالكاميرا
  mobile_scanner: ^5.2.3

  # توليد ومشاركة PDF لتفاصيل العرض
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
