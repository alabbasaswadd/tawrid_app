name: tawrid_app
description: "توريد — منصة التوريد الدوائي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0

  # Networking
  dio: ^5.11.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Font
  google_fonts: ^6.2.1

  # Logging
  logger: ^2.7.0

  # مسح الباركود بالكاميرا
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
